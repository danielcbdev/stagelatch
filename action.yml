name: stagelatch
description: >-
  Run stagelatch ci on a pull request: the same checks as the git hooks,
  over the pull request's diff. With tests/affected enabled (the default),
  this executes the pull request's tests and the code they import. With
  custom_checks configured, child processes from the branch also run unless
  no-custom-checks is true (recommended for pull requests from forks).
author: danielcbdev
branding:
  icon: check-square
  color: blue

inputs:
  base:
    description: >-
      The ref the pull request merges into, for example
      origin/${{ github.base_ref }}. The checkout needs fetch-depth: 0.
    required: true
  version:
    description: The stagelatch version to activate. Empty means the latest.
    required: false
    default: ''
  reporter:
    description: console, json, github, junit or sarif.
    required: false
    default: github
  output:
    description: >-
      Optional path to write the report to. When set, stdout is redirected
      there and the exit code is preserved. Useful for sarif and junit.
    required: false
    default: ''
  no-custom-checks:
    description: >-
      When true, passes --no-custom-checks so no custom-check child starts.
      Use for pull requests from forks (or any CI that must not execute
      untrusted check code from the branch). Same warning class as
      tests/affected executing PR tests.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Inputs reach the scripts as environment variables, never as text
    # interpolated into the script, so no input can inject a command.
    - name: Activate stagelatch
      shell: bash
      env:
        STAGELATCH_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$STAGELATCH_VERSION" ]; then
          dart pub global activate stagelatch "$STAGELATCH_VERSION"
        else
          dart pub global activate stagelatch
        fi

    - name: Run stagelatch ci
      shell: bash
      env:
        STAGELATCH_BASE: ${{ inputs.base }}
        STAGELATCH_REPORTER: ${{ inputs.reporter }}
        STAGELATCH_OUTPUT: ${{ inputs.output }}
        STAGELATCH_NO_CUSTOM_CHECKS: ${{ inputs.no-custom-checks }}
      run: |
        set +e
        extra=()
        case "$STAGELATCH_NO_CUSTOM_CHECKS" in
          true|TRUE|True|1|yes|YES) extra+=(--no-custom-checks) ;;
        esac
        if [ -n "$STAGELATCH_OUTPUT" ]; then
          dart pub global run stagelatch ci --base "$STAGELATCH_BASE" --reporter "$STAGELATCH_REPORTER" "${extra[@]}" > "$STAGELATCH_OUTPUT"
          exit $?
        fi
        dart pub global run stagelatch ci --base "$STAGELATCH_BASE" --reporter "$STAGELATCH_REPORTER" "${extra[@]}"
        exit $?
