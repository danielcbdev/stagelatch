name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Dispatched by release-please.yaml on the release tag; see the comment
  # there. A dispatch on a branch is refused by pub.dev (refType must be
  # "tag"), so it cannot publish anything but a tagged version.
  workflow_dispatch:

# The reusable workflow checks the repository out, then mints an OIDC token
# for pub.dev. id-token is set on the job, which is the permission that call
# actually receives.
permissions:
  contents: read

jobs:
  publish:
    permissions:
      id-token: write
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
    with:
      use-flutter: false
