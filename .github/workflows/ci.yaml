name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# Security rule S8: least privilege, stated explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / dart ${{ matrix.sdk }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [stable, beta]
    steps:
      # Full history: acceptance tests and `stagelatch ci` need merge bases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      # Formatter output is specific to an SDK release (ADR-0008), so the
      # check is authoritative on stable only.
      - name: Check formatting
        if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test --coverage-path=coverage/lcov.info

      - name: Check coverage floor
        if: matrix.os == 'ubuntu-latest' && matrix.sdk == 'stable'
        run: dart run tool/check_coverage.dart
